site_name: NetWatchAI
site_description: AI-powered network intrusion detection — real-time dashboard, free alerts, zero config.
site_url: https://udayak.github.io/NetWatchAI/
repo_url: https://github.com/udayak/NetWatchAI
repo_name: udayak/NetWatchAI
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Install: install.md
  - Configure Alerts: alerts.md
  - Observability: observability.md
  - Architecture: architecture.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
